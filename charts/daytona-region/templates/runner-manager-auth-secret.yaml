{{- if and .Values.services.runnermanager.enabled (not .Values.services.runnermanager.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "daytona.runnermanagerAuthSecretName" . }}
  namespace: {{ include "daytona.namespace" . }}
  labels:
    {{- include "daytona.labels" . | nindent 4 }}
    app.kubernetes.io/component: runnermanager
type: Opaque
stringData:
  {{ .Values.services.runnermanager.auth.apiKeyKey }}: {{ required "services.runnermanager.auth.apiKey is required when auth.existingSecret is empty" .Values.services.runnermanager.auth.apiKey | quote }}
  {{ .Values.services.runnermanager.auth.systemApiTokenKey }}: {{ required "services.runnermanager.auth.systemApiToken is required when auth.existingSecret is empty" .Values.services.runnermanager.auth.systemApiToken | quote }}
{{- end }}
